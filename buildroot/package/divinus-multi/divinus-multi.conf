# Divinus x86 unified WebUI/API launcher configuration.
# The central process owns the only HTTP port. Camera workers use web_port: 0.
MULTI_WEB_PORT=80
MULTI_RTSP_PORT_CENTRAL=554
MULTI_CAMERAS=1
MULTI_DEVICE_1=/dev/video0
MULTI_DEVICE_2=/dev/video1
MULTI_DEVICE_3=/dev/video2
MULTI_DEVICE_4=/dev/video3
MULTI_RTSP_PORT_1=555
MULTI_RTSP_PORT_2=556
MULTI_RTSP_PORT_3=557
MULTI_RTSP_PORT_4=558
# ONVIF is deliberately not managed here; do not assume discovery works with
# multiple instances (WS-Discovery is shared). Configure and validate it separately.
