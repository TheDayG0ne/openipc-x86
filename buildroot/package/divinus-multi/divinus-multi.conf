# Divinus x86 multi-camera launcher configuration.
# Use 1..4 independent UVC devices. Instance 1 always provides setup on port 80;
# absent additional devices are skipped. This is startup-only, not hotplug management.
MULTI_CAMERAS=1
MULTI_DEVICE_1=/dev/video0
MULTI_DEVICE_2=/dev/video1
MULTI_DEVICE_3=/dev/video2
MULTI_DEVICE_4=/dev/video3
MULTI_WEB_PORT_1=80
MULTI_WEB_PORT_2=81
MULTI_WEB_PORT_3=82
MULTI_WEB_PORT_4=83
MULTI_RTSP_PORT_1=554
MULTI_RTSP_PORT_2=555
MULTI_RTSP_PORT_3=556
MULTI_RTSP_PORT_4=557
# ONVIF is deliberately not managed here; do not assume discovery works with
# multiple instances (WS-Discovery is shared). Configure and validate it separately.
